<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRa chat</title>
<link rel="icon" href="data:,">
<style>
/* Design tokens copied from frontend/theme.ts (colors, gradients, space,
   radius, size, font, layout). Use only these below; keep them in sync. */
:root {
  --color-text: #FFFFFF;
  --color-text-secondary: #A4A4A4;
  --color-error: #FFB4B4;
  --color-glass: rgba(251, 252, 253, 0.16);
  --color-glass-active: rgba(251, 252, 253, 0.26);
  --color-glass-border: rgba(255, 255, 255, 0.2);
  --color-focus-border: rgba(255, 255, 255, 0.7);

  --gradient-background:
    radial-gradient(70% 35% at 0% 38%, rgba(30, 60, 230, 0.9) 0%, rgba(30, 60, 230, 0) 100%),
    radial-gradient(60% 35% at 100% 42%, rgba(115, 8, 200, 0.9) 0%, rgba(115, 8, 200, 0) 100%),
    radial-gradient(80% 30% at 50% 0%, rgba(70, 10, 150, 0.8) 0%, rgba(70, 10, 150, 0) 100%),
    linear-gradient(180deg, #160c5c 0%, #2a2590 45%, #0b0a4c 78%, #070939 100%);
  --color-background-end: #070939; /* last stop of gradients.background */

  --space-xs: 4px;
  --space-s: 8px;
  --space-m: 16px;
  --space-card: 20px;
  --space-input-inset: 27px;
  --space-l: 32px;
  --space-content-top: 112px;
  --space-nav-bottom: 44px;

  --radius-pill: 32px;
  --radius-card: 24px;

  --size-control: 58px;
  --size-icon-small: 14px;
  --size-icon: 20px;

  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --font-title-size: 40px;   --font-title-line: 48px;   --font-title-weight: 400;
  --font-subtitle-size: 14px; --font-subtitle-line: 17px;
  --font-body-size: 16px;    --font-body-line: 19px;
  --font-button-size: 16px;  --font-button-line: 19px;  --font-button-weight: 600;
  --font-label-size: 12px;   --font-label-line: 15px;

  --border-width: 1px;
  --disabled-opacity: 0.4;
}

* { box-sizing: border-box; }
html { background-color: var(--color-background-end); } /* shown on overscroll */
body {
  margin: 0;
  min-height: 100dvh;
  background-image: var(--gradient-background);
  background-attachment: fixed;
  color: var(--color-text);
  font-family: var(--font-family);
  font-size: var(--font-body-size);
  line-height: var(--font-body-line);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }

.glass {
  background-color: var(--color-glass);
  border: var(--border-width) solid var(--color-glass-border);
}
.secondary { color: var(--color-text-secondary); }
.error { color: var(--color-error); }
.label { font-size: var(--font-label-size); line-height: var(--font-label-line); }
.subtitle { font-size: var(--font-subtitle-size); line-height: var(--font-subtitle-line); }

/* Page */
.top {
  height: var(--space-content-top);
  padding: 0 var(--space-l);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--space-xs);
}
.top h1 {
  margin: 0;
  font-size: var(--font-title-size);
  line-height: var(--font-title-line);
  font-weight: var(--font-title-weight);
}
.panes {
  height: calc(100dvh - var(--space-content-top) - var(--space-nav-bottom));
  padding: 0 var(--space-l);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-columns: 1fr;
  grid-auto-flow: column;
  gap: var(--space-m);
}

/* One chat pane */
.pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-card);
  overflow: hidden;
}
body.page-focused .pane.active { border-color: var(--color-focus-border); }
.pane-head {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-m) var(--space-card);
  border-bottom: var(--border-width) solid var(--color-glass-border);
}
.pane-head .who { flex: 1; min-width: 0; }
.pane-head .name {
  font-size: var(--font-button-size);
  line-height: var(--font-button-line);
  font-weight: var(--font-button-weight);
}
.pane-head .port { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot {
  flex: none;
  width: var(--space-s);
  height: var(--space-s);
  border-radius: 50%;
  background-color: var(--color-text);
}
.dot.off { background-color: var(--color-error); }
.dot.wait { background-color: var(--color-text-secondary); }
.badge {
  flex: none;
  padding: var(--space-xs) var(--space-s);
  border-radius: var(--radius-pill);
  background-color: var(--color-glass-active);
  border: var(--border-width) solid var(--color-focus-border);
  font-size: var(--font-label-size);
  line-height: var(--font-label-line);
  font-weight: var(--font-button-weight);
}
.badge[hidden] { display: none; }

.list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-m) var(--space-card);
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
}
.empty { margin: auto; text-align: center; }
.row { display: flex; flex-direction: column; max-width: 80%; gap: var(--space-xs); }
.row.out { align-self: flex-end; align-items: flex-end; }
.row.in { align-self: flex-start; align-items: flex-start; }
.bubble {
  padding: var(--space-s) var(--space-m);
  border-radius: var(--radius-card);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.row.out .bubble { background-color: var(--color-glass-active); }
.row.in .bubble.unread { border-color: var(--color-focus-border); }
.meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-xs);
  margin-top: var(--space-xs);
  white-space: nowrap;
}
.ticks { display: inline-flex; align-items: center; gap: var(--space-xs); color: var(--color-text-secondary); }
.ticks.read { color: var(--color-text); }
.ticks.failed { color: var(--color-error); }
.ticks svg { width: var(--size-icon); height: var(--size-icon-small); display: block; }
.signal { padding: 0 var(--space-s); }

.composer {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-m) var(--space-card);
  border-top: var(--border-width) solid var(--color-glass-border);
}
.field { flex: 1; min-width: 0; position: relative; }
.field input {
  width: 100%;
  height: var(--size-control);
  padding: 0 var(--space-input-inset);
  border-radius: var(--radius-pill);
  outline: none;
}
.field input::placeholder { color: var(--color-text-secondary); }
.field input:focus { border-color: var(--color-focus-border); }
.field.counting input { padding-right: calc(var(--space-input-inset) * 2 + var(--space-m)); }
.counter {
  position: absolute;
  right: var(--space-card);
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}
.composer button {
  flex: none;
  height: var(--size-control);
  padding: 0 var(--space-card);
  border-radius: var(--radius-pill);
  font-size: var(--font-button-size);
  line-height: var(--font-button-line);
  font-weight: var(--font-button-weight);
  cursor: pointer;
}
.composer button:focus-visible { outline: none; border-color: var(--color-focus-border); }
.composer :disabled { opacity: var(--disabled-opacity); cursor: default; }
.pane-note { padding: 0 var(--space-card) var(--space-s); }
.pane-note:empty { display: none; }

/* Location strip under the pane header */
.banner {
  margin: var(--space-s) var(--space-card) 0;
  padding: var(--space-s) var(--space-m);
  border-radius: var(--radius-card);
  background-color: var(--color-glass-active);
  border-color: var(--color-focus-border);
  font-weight: var(--font-button-weight);
}
.banner[hidden] { display: none; }
.loc {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-s) var(--space-card);
  border-bottom: var(--border-width) solid var(--color-glass-border);
}
.loc .texts { flex: 1; min-width: 0; }
.loc .friend, .loc .own { overflow-wrap: anywhere; }
.loc.stale .friend { color: var(--color-text-secondary); }
.loc.stale .compass { opacity: var(--disabled-opacity); }
.compass { flex: none; width: calc(var(--size-icon) + var(--space-xs)); height: auto; display: block; }
.compass[hidden] { display: none; }
.compass circle { fill: none; stroke: var(--color-glass-border); }
.compass .tick { stroke: currentColor; }
.compass text { font-size: 7px; font-weight: var(--font-button-weight); fill: currentColor; }
.compass .needle { transform-box: view-box; transform-origin: 12px 18px; }
.small-btn {
  flex: none;
  padding: var(--space-xs) var(--space-m);
  border-radius: var(--radius-pill);
  font-size: var(--font-label-size);
  line-height: var(--font-label-line);
  font-weight: var(--font-button-weight);
  cursor: pointer;
  white-space: nowrap;
}
.small-btn:focus-visible { outline: none; border-color: var(--color-focus-border); }
.small-btn:disabled { opacity: var(--disabled-opacity); cursor: default; }

/* Test position forms in the debug area */
.testpos { display: flex; flex-direction: column; gap: var(--space-s); margin-top: var(--space-s); }
.tp {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-s) var(--space-m);
  border-radius: var(--radius-card);
}
.tp .tp-name { font-weight: var(--font-button-weight); color: var(--color-text); }
.tp input {
  width: calc(var(--space-l) * 3.5);
  padding: var(--space-xs) var(--space-m);
  border-radius: var(--radius-pill);
  outline: none;
  font-size: var(--font-label-size);
  line-height: var(--font-label-line);
  font-variant-numeric: tabular-nums;
}
.tp input:focus { border-color: var(--color-focus-border); }
.tp input::placeholder { color: var(--color-text-secondary); }
.tp input:disabled { opacity: var(--disabled-opacity); }
.tp .tp-note { flex-basis: 100%; }
.tp .tp-note:empty { display: none; }

/* Placeholder for a missing board */
.pane.missing {
  border-style: dashed;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-l);
  gap: var(--space-s);
  background-color: transparent;
}
.pane.missing .big {
  font-size: var(--font-button-size);
  line-height: var(--font-button-line);
  font-weight: var(--font-button-weight);
}

/* Debug log */
.debug {
  min-height: var(--space-nav-bottom);
  padding: var(--space-m) var(--space-l) 0;
}
.debug summary { cursor: pointer; color: var(--color-text-secondary); }
.debug .log {
  margin: var(--space-s) 0 var(--space-l);
  padding: var(--space-m);
  border-radius: var(--radius-card);
  max-height: 50dvh;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 699px) {
  .top, .panes, .debug { padding-left: var(--space-m); padding-right: var(--space-m); }
  .panes {
    grid-template-columns: 1fr;
    grid-auto-flow: row;
    grid-auto-rows: 1fr;
    gap: var(--space-s);
  }
  .pane-head { padding: var(--space-s) var(--space-m); }
  .loc { padding: var(--space-xs) var(--space-m); }
  .banner { margin: var(--space-xs) var(--space-m) 0; }
  .list { padding: var(--space-s) var(--space-m); }
  .composer { padding: var(--space-s); }
  .pane.missing { padding: var(--space-m); }
}
</style>
</head>
<body>
<header class="top">
  <h1>LoRa chat</h1>
  <div id="status" class="subtitle secondary">Connecting to chat.py…</div>
</header>
<main id="panes" class="panes" aria-live="polite"></main>
<details id="debug" class="debug label">
  <summary>Debug: test position and raw serial lines</summary>
  <div id="testpos" class="testpos"></div>
  <div id="log" class="log glass"></div>
</details>

<script>
'use strict';

const MAX_BYTES_DEFAULT = 180;
const COUNTER_FROM = 150;          // show the byte counter from here on
const enc = new TextEncoder();

const state = {
  online: false,
  devices: new Map(),   // id -> {id, port, state, firstSeen, error}
  ports: [],            // [{port, state, error}] boards that have no ID yet
  messages: new Map(),  // id -> message
  logs: [],
  maxBytes: MAX_BYTES_DEFAULT,
  gps: {},              // device id -> {fix, sats, lat, lon, kmh, course, hdop, t}
  peers: {},            // device id -> {peer id -> {id, lat, lon, age, dist, bearing, rssi, snr, t}}
  findme: {},           // device id -> {from, t}: someone asked this board to be found
  findsent: {},         // device id -> t of the board's last FINDSENT
};
const FINDME_MS = 10000;     // the board flashes this long
const SENT_MS = 3000;        // "Sent" on the Find button
const STALE_S = 120;         // friend's position counts as old after this
const NEARBY_M = 15;
const GPS_GONE_MS = 10000;   // GPS lines come every 2 s
const PRESET = { name: 'Amsterdam Dam', lat: 52.3731, lon: 4.8925 };
const panes = new Map();   // device id -> pane object
const readPosted = new Set();
let activePane = null;

// ---------- helpers ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svg(markup) {
  const t = document.createElement('template');
  t.innerHTML = markup.trim();
  return t.content.firstChild;
}
const ONE_TICK = '<svg viewBox="0 0 20 14" aria-hidden="true"><path d="M3 7.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const COMPASS = '<svg class="compass" viewBox="0 0 24 30" role="img"><text x="12" y="6" text-anchor="middle">N</text><path class="tick" d="M12 7.5v2" stroke-width="1.2"/><circle cx="12" cy="18" r="10.5" stroke-width="1"/><path class="needle" d="M12 10.5l4.5 12-4.5-2.7-4.5 2.7z" fill="currentColor"/></svg>';
const TWO_TICKS = '<svg viewBox="0 0 20 14" aria-hidden="true"><path d="M1 7.5l3 3 7-7M9 10.5l7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function clock(ms) {
  return ms ? new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}
function fullTime(ms) {
  return ms ? new Date(ms).toLocaleString() : '';
}
function signal(s) {
  if (!s || s.rssi == null) return '';
  const parts = [`${s.rssi} dBm`];
  if (s.snr != null) parts.push(`SNR ${s.snr}`);
  return parts.join(' · ');
}
function post(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(async r => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.error || `Request failed (${r.status})`);
    return b;
  }, () => { throw new Error('chat.py is not reachable'); });
}
const POINTS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
function point(deg) { return POINTS[Math.round((((deg % 360) + 360) % 360) / 45) % 8]; }
// Non-breaking spaces inside each part, so a narrow strip wraps only at " · ".
const nb = s => s.replace(/ /g, '\u00a0');
function distance(m) {
  if (m < 1000) return nb(`${Math.round(m)} m`);
  return nb(m < 10000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m / 1000)} km`);
}
function ago(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return nb(`${s} s ago`);
  return nb(s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`);
}
function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }
// The board the user is looking for: the other pane, else whoever this board hears.
function friendOf(id) {
  const other = sortedDevices().find(d => d.id !== id);
  if (other) return other.id;
  return Object.keys(state.peers[id] || {}).find(k => k !== id) || null;
}
function bytes(s) { return enc.encode(s).length; }
function connected(d) { return d && d.state === 'connected'; }
function sortedDevices() {
  return [...state.devices.values()].sort((a, b) =>
    (connected(b) - connected(a)) || (a.firstSeen - b.firstSeen));
}
function paneMessages(id) {
  return [...state.messages.values()]
    .filter(m => (m.local && m.from === id) || (m.received && m.to === id))
    .sort((a, b) => (time(a, id) - time(b, id)) || (a.id - b.id));
}
function time(m, id) { return (m.local && m.from === id) ? m.sentAt : m.receivedAt; }
function unreadIn(id) {
  let n = 0;
  for (const m of state.messages.values()) if (m.received && m.to === id && !m.readLocal) n++;
  return n;
}

// ---------- pane ----------
function makePane(id) {
  const p = { id, sig: '' };
  p.el = el('section', 'pane glass');
  p.el.setAttribute('aria-label', `Board ${id}`);

  const head = el('div', 'pane-head');
  p.dot = el('span', 'dot');
  const who = el('div', 'who');
  p.name = el('div', 'name', `Board ${id}`);
  p.port = el('div', 'port label secondary');
  who.append(p.name, p.port);
  p.badge = el('span', 'badge');
  p.badge.hidden = true;
  head.append(p.dot, who, p.badge);

  p.banner = el('div', 'banner glass subtitle');
  p.banner.setAttribute('role', 'alert');
  p.banner.hidden = true;

  p.loc = el('div', 'loc');
  p.compass = svg(COMPASS);
  p.needle = p.compass.querySelector('.needle');
  const texts = el('div', 'texts');
  p.friend = el('div', 'friend subtitle');
  p.own = el('div', 'own label secondary');
  texts.append(p.friend, p.own);
  p.find = el('button', 'small-btn glass');
  p.find.type = 'button';
  p.loc.append(p.compass, texts, p.find);
  p.find.addEventListener('click', () => findMe(p));

  p.list = el('div', 'list');
  p.list.setAttribute('role', 'log');

  p.note = el('div', 'pane-note label error');

  p.form = el('form', 'composer');
  const field = el('div', 'field');
  p.field = field;
  p.input = el('input', 'glass');
  p.input.type = 'text';
  p.input.autocomplete = 'off';
  p.input.enterKeyHint = 'send';
  p.input.setAttribute('aria-label', `Message from board ${id}`);
  p.counter = el('span', 'counter label secondary');
  p.counter.hidden = true;
  field.append(p.input, p.counter);
  p.button = el('button', 'glass', 'Send');
  p.button.type = 'submit';
  p.form.append(field, p.button);

  p.el.append(head, p.banner, p.loc, p.list, p.note, p.form);

  // Read rule: this pane counts as "looked at" once the user clicks in it
  // or focuses its composer.
  const activate = () => { activePane = id; markActive(); checkRead(); };
  p.el.addEventListener('pointerdown', activate);
  p.el.addEventListener('focusin', activate);

  p.input.addEventListener('input', () => updateComposer(p));
  p.form.addEventListener('submit', e => { e.preventDefault(); send(p); });
  return p;
}

function updateComposer(p) {
  const d = state.devices.get(p.id);
  const on = connected(d);
  const text = p.input.value.trim();
  const n = bytes(text);
  const max = state.maxBytes;
  p.input.disabled = !on;
  p.input.placeholder = on ? 'Message' : 'Plug the board back in';
  const show = n >= COUNTER_FROM;
  p.counter.hidden = !show;
  p.field.classList.toggle('counting', show);
  p.counter.textContent = `${n}/${max}`;
  p.counter.classList.toggle('error', n > max);
  p.counter.classList.toggle('secondary', n <= max);
  p.button.disabled = !on || !text || n > max || p.sending;
}

async function send(p) {
  const text = p.input.value.trim();
  if (p.button.disabled || !text) return;
  p.sending = true;
  updateComposer(p);
  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: p.id, text }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `Send failed (${r.status})`);
    p.input.value = '';
    p.note.textContent = '';
    if (body.message) upsertMessage(body.message);
  } catch (err) {
    p.note.textContent = err.message === 'Failed to fetch' ? 'chat.py is not reachable' : err.message;
  } finally {
    p.sending = false;
    updateComposer(p);
    p.input.focus();
  }
}

function ticks(m) {
  const t = el('span', 'ticks');
  if (m.status === 'failed') {
    t.classList.add('failed');
    t.append(el('span', null, 'Not delivered'));
  } else if (m.status === 'read') {
    t.classList.add('read');
    t.append(svg(TWO_TICKS), el('span', null, 'Read'));
    t.title = `Read ${fullTime(m.readAt)}`;
  } else if (m.status === 'delivered') {
    t.append(svg(TWO_TICKS));
    t.title = 'Delivered to the other board';
  } else if (m.status === 'sent') {
    t.append(svg(ONE_TICK));
    t.title = 'Sent over the radio';
  } else {
    t.append(el('span', null, 'Sending'));
  }
  return t;
}

function renderList(p) {
  const msgs = paneMessages(p.id);
  const sig = JSON.stringify(msgs.map(m => [m.id, m.status, m.readLocal, m.received, m.delivery, m.rx]));
  if (sig === p.sig) return;
  const first = p.sig === '';
  p.sig = sig;
  const atBottom = p.list.scrollHeight - p.list.scrollTop - p.list.clientHeight < 48;
  p.list.textContent = '';
  if (!msgs.length) {
    const other = sortedDevices().find(d => d.id !== p.id);
    p.list.append(el('div', 'empty subtitle secondary',
      other ? `No messages yet. Say hi to board ${other.id}.` : 'No messages yet.'));
    return;
  }
  for (const m of msgs) {
    const out = m.local && m.from === p.id;
    const row = el('div', `row ${out ? 'out' : 'in'}`);
    const bubble = el('div', 'bubble glass');
    if (!out && !m.readLocal) bubble.classList.add('unread');
    bubble.append(el('div', null, m.text));
    const meta = el('div', 'meta label secondary');
    const t = el('time', null, clock(out ? m.sentAt : m.receivedAt));
    t.title = fullTime(out ? m.sentAt : m.receivedAt);
    meta.append(t);
    if (out) meta.append(ticks(m));
    bubble.append(meta);
    row.append(bubble);
    const sigText = out
      ? (m.delivery ? `Delivered · ${signal(m.delivery)}` : '')
      : signal(m.rx);
    if (sigText) row.append(el('div', 'signal label secondary', sigText));
    p.list.append(row);
  }
  if (first || atBottom) p.stick = true;   // scrolled after the pane is in the page
}

function ownGpsText(g) {
  if (!g || Date.now() - g.t > GPS_GONE_MS) return ['GPS: no data from the board', ''];
  if (g.fix === 2) return ['GPS: test position', `Test position ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}. Clear it in the debug area.`];
  if (g.fix === 1) {
    const acc = Math.max(1, Math.round(g.hdop * 2.5));
    return [`GPS: ${plural(g.sats, 'satellite')} · about ±${acc} m`,
      `Rough accuracy from HDOP ${g.hdop} × 2.5 m`];
  }
  return [`GPS: searching · ${plural(g.sats, 'satellite')}`, 'Needs a view of the sky'];
}

function renderLoc(p) {
  const d = state.devices.get(p.id);
  const f = friendOf(p.id);
  const peer = f && (state.peers[p.id] || {})[f];
  const [own, ownTitle] = ownGpsText(state.gps[p.id]);
  p.own.textContent = own;
  p.own.title = ownTitle;

  let text, arrow = null, stale = false;
  if (!peer) {
    text = f ? `No position from ${f} yet` : 'No position from the other board yet';
  } else {
    const age = peer.age + (Date.now() - peer.t) / 1000;
    stale = age > STALE_S;
    if (peer.dist < 0) text = `${f} is sharing its position, waiting for your own GPS`;
    else if (peer.dist < NEARBY_M) text = `${f} · nearby · ${ago(age)}`;
    else {
      arrow = peer.bearing;
      text = `${f} · ${distance(peer.dist)} · ${nb(`${Math.round(peer.bearing)}° ${point(peer.bearing)}`)} · ${ago(age)}`;
    }
    p.friend.title = `${f} at ${peer.lat.toFixed(6)}, ${peer.lon.toFixed(6)} · ${signal(peer)}`;
  }
  if (!peer) p.friend.title = '';
  p.friend.textContent = text;
  p.loc.classList.toggle('stale', stale);
  p.compass.toggleAttribute('hidden', arrow == null);   // SVG has no .hidden property
  if (arrow != null) {
    p.needle.style.transform = `rotate(${arrow}deg)`;
    p.compass.setAttribute('aria-label', `Direction ${Math.round(arrow)}° ${point(arrow)}, north up`);
  }

  const sentAt = Math.max(p.sentAt || 0, state.findsent[p.id] || 0);
  const justSent = Date.now() - sentAt < SENT_MS;
  p.find.textContent = p.finding ? 'Sending…' : justSent ? 'Sent' : `Find ${f || 'friend'}`;
  p.find.disabled = !connected(d) || p.finding;
  p.find.title = `Make ${f || 'the other board'} flash its LED and screen for 10 seconds`;

  const fm = state.findme[p.id];
  const show = fm && Date.now() - fm.t < FINDME_MS;
  p.banner.hidden = !show;
  if (show) p.banner.textContent = `${fm.from} is looking for you. Your board is flashing.`;
}

async function findMe(p) {
  if (p.find.disabled) return;
  p.finding = true;
  renderLoc(p);
  try {
    await post('/api/findme', { device: p.id });
    p.sentAt = Date.now();
    p.note.textContent = '';
  } catch (err) {
    p.note.textContent = err.message;
  } finally {
    p.finding = false;
    renderLoc(p);
  }
}

function renderPane(p) {
  const d = state.devices.get(p.id);
  const on = connected(d);
  p.dot.className = `dot ${on ? '' : 'off'}`;
  p.port.textContent = `${d.port || 'unknown port'} · ${on ? 'Connected' : 'Disconnected'}`;
  const unread = unreadIn(p.id);
  p.badge.hidden = unread === 0;
  p.badge.textContent = `${unread} unread`;
  if (d.error && d.error.text) p.note.textContent = `Board says: ${d.error.text}`;
  renderLoc(p);
  renderList(p);
  updateComposer(p);
}

function missingPane(title, text, wait) {
  const box = el('section', 'pane missing glass');
  const head = el('div', 'big');
  if (wait != null) {
    const dot = el('span', `dot ${wait ? 'wait' : 'off'}`);
    dot.style.display = 'inline-block';
    dot.style.marginRight = 'var(--space-s)';
    dot.style.verticalAlign = 'middle';
    head.append(dot);
  }
  head.append(title);
  box.append(head, el('div', 'subtitle secondary', text));
  return box;
}

// ---------- page ----------
let scheduled = false;
function render() {
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(() => { scheduled = false; renderNow(); });
}

function renderNow() {
  const devs = sortedDevices();
  const nConnected = devs.filter(connected).length;
  // Connected boards first, then disconnected ones to fill two slots; shown
  // in the order they were first seen so panes don't swap on unplug.
  const shown = devs.slice(0, Math.max(2, nConnected))
    .sort((a, b) => (a.firstSeen - b.firstSeen) || a.id.localeCompare(b.id));

  const nodes = [];
  for (const d of shown) {
    let p = panes.get(d.id);
    if (!p) { p = makePane(d.id); panes.set(d.id, p); }
    renderPane(p);
    nodes.push(p.el);
  }
  for (const [id, p] of panes) if (!shown.find(d => d.id === id)) { panes.delete(id); }

  // Fill the empty slots with what is missing, in plain words.
  const pending = [...state.ports];
  while (nodes.length < 2) {
    const port = pending.shift();
    if (port && port.state === 'error') {
      nodes.push(missingPane(`Can't open ${port.port}`,
        `${port.error || 'Unknown error'}. Close other programs that use this port, like a serial monitor or the flasher. Retrying every 2 seconds.`, false));
    } else if (port) {
      nodes.push(missingPane(`Connecting to ${port.port}`,
        'Waiting for the board to send its ID. If this takes long, press the reset button on the board.', true));
    } else if (nodes.length === 0) {
      nodes.push(missingPane('No boards found',
        'Plug a LoRa board into a USB port of this Mac. It shows up here within a few seconds.'));
    } else {
      nodes.push(missingPane('Plug in a second board',
        'You need two boards to chat. Plug another LoRa board into a USB port.'));
    }
  }
  const root = document.getElementById('panes');
  // Re-append only when the order changed, so focus and scroll stay put.
  const same = root.children.length === nodes.length && nodes.every((n, i) => root.children[i] === n);
  if (!same) root.replaceChildren(...nodes);
  for (const p of panes.values()) {
    if (p.stick) { p.list.scrollTop = p.list.scrollHeight; p.stick = false; }
  }

  const status = document.getElementById('status');
  status.classList.toggle('error', !state.online);
  status.classList.toggle('secondary', state.online);
  if (!state.online) status.textContent = 'Lost connection to chat.py. Is it still running?';
  else if (nConnected === 0) status.textContent = 'No boards connected. Plug in two LoRa boards over USB.';
  else if (nConnected === 1) status.textContent = 'One board connected. Plug in a second board.';
  else status.textContent = `${nConnected} boards connected. Type in either pane to send.`;

  markActive();
  renderTestPos();
  renderLog();
  checkRead();
}

function markActive() {
  document.body.classList.toggle('page-focused', document.visibilityState === 'visible' && document.hasFocus());
  for (const [id, p] of panes) p.el.classList.toggle('active', id === activePane);
}

// Post /api/read once per unread message, but only while the window is
// focused and visible and the user has picked this pane.
function checkRead() {
  markActive();
  if (!activePane || document.visibilityState !== 'visible' || !document.hasFocus()) return;
  for (const m of state.messages.values()) {
    if (!m.received || m.to !== activePane || m.readLocal || readPosted.has(m.id)) continue;
    readPosted.add(m.id);
    fetch('/api/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: m.to, from: m.from, n: m.n }),
    }).then(r => { if (!r.ok) throw new Error(); })
      .catch(() => { readPosted.delete(m.id); });
  }
}

const testForms = new Map();   // device id -> form
function makeTestForm(id) {
  const t = { id };
  t.el = el('form', 'tp glass');
  t.el.noValidate = true;
  t.el.append(el('span', 'tp-name', `Board ${id}`));
  const input = (name, ph) => {
    const i = el('input', 'glass');
    i.type = 'text';
    i.inputMode = 'decimal';
    i.autocomplete = 'off';
    i.placeholder = ph;
    i.setAttribute('aria-label', `${name} for board ${id}`);
    return i;
  };
  t.lat = input('Latitude', 'Latitude');
  t.lon = input('Longitude', 'Longitude');
  t.set = el('button', 'small-btn glass', 'Set');
  t.set.type = 'submit';
  t.clear = el('button', 'small-btn glass', 'Clear');
  t.clear.type = 'button';
  t.preset = el('button', 'small-btn glass', PRESET.name);
  t.preset.type = 'button';
  t.note = el('span', 'tp-note');
  t.el.append(t.lat, t.lon, t.set, t.clear, t.preset, t.note);
  const go = async (body, done) => {
    t.busy = true; renderTestForm(t);
    try { await post('/api/setpos', { device: id, ...body }); t.msg = done; t.err = false; }
    catch (err) { t.msg = err.message; t.err = true; }
    t.busy = false; renderTestForm(t);
  };
  t.el.addEventListener('submit', e => {
    e.preventDefault();
    const lat = Number(t.lat.value.trim().replace(',', '.'));
    const lon = Number(t.lon.value.trim().replace(',', '.'));
    if (!t.lat.value.trim() || !Number.isFinite(lat) || lat < -90 || lat > 90) {
      t.msg = 'Latitude must be a number from -90 to 90'; t.err = true; return renderTestForm(t);
    }
    if (!t.lon.value.trim() || !Number.isFinite(lon) || lon < -180 || lon > 180) {
      t.msg = 'Longitude must be a number from -180 to 180'; t.err = true; return renderTestForm(t);
    }
    go({ lat, lon }, 'Test position sent to the board');
  });
  t.clear.addEventListener('click', () => go({ off: true }, 'Test position cleared, back to real GPS'));
  t.preset.addEventListener('click', () => {
    t.lat.value = PRESET.lat.toFixed(6);
    t.lon.value = PRESET.lon.toFixed(6);
    go({ lat: PRESET.lat, lon: PRESET.lon }, `Test position set to ${PRESET.name}`);
  });
  return t;
}

function renderTestForm(t) {
  const on = connected(state.devices.get(t.id));
  for (const c of [t.lat, t.lon, t.set, t.clear, t.preset]) c.disabled = !on || t.busy;
  const g = state.gps[t.id];
  const now = !on ? 'Board is not connected'
    : !g || Date.now() - g.t > GPS_GONE_MS ? ''
    : g.fix === 2 ? `Now using test position ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}`
    : 'Now using real GPS';
  t.note.textContent = [t.msg, now].filter(Boolean).join(' · ');
  t.note.className = `tp-note ${t.err ? 'error' : 'secondary'}`;
}

function renderTestPos() {
  const ids = [...panes.keys()];
  for (const id of ids) if (!testForms.has(id)) testForms.set(id, makeTestForm(id));
  const box = document.getElementById('testpos');
  const nodes = ids.map(id => testForms.get(id).el);
  const same = box.children.length === nodes.length && nodes.every((n, i) => box.children[i] === n);
  if (!same) box.replaceChildren(...nodes);
  for (const id of ids) renderTestForm(testForms.get(id));
}

function renderLog() {
  const dbg = document.getElementById('debug');
  if (!dbg.open) return;
  const box = document.getElementById('log');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  box.textContent = state.logs.slice(-300).map(l =>
    `${new Date(l.t).toLocaleTimeString()}  ${l.port}  ${l.dir === 'tx' ? '→' : '←'}  ${l.line}`).join('\n')
    || 'Nothing yet.';
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function upsertMessage(m) {
  state.messages.set(m.id, m);
  render();
}

// ---------- events ----------
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('open', () => { state.online = true; render(); });
  es.addEventListener('error', () => { state.online = false; render(); });
  es.addEventListener('snapshot', e => {
    const s = JSON.parse(e.data);
    state.online = true;
    state.devices = new Map(s.devices.map(d => [d.id, d]));
    state.ports = s.ports;
    state.messages = new Map(s.messages.map(m => [m.id, m]));
    state.logs = s.logs;
    state.maxBytes = s.maxBytes || MAX_BYTES_DEFAULT;
    state.gps = s.gps || {};
    state.peers = s.peers || {};
    state.findme = s.findme || {};
    state.findsent = s.findsent || {};
    for (const p of panes.values()) p.sig = 'stale';
    render();
  });
  es.addEventListener('device', e => {
    const d = JSON.parse(e.data);
    state.devices.set(d.id, d);
    render();
  });
  es.addEventListener('ports', e => { state.ports = JSON.parse(e.data); render(); });
  es.addEventListener('message', e => upsertMessage(JSON.parse(e.data)));
  es.addEventListener('gps', e => { const x = JSON.parse(e.data); state.gps[x.device] = x.gps; render(); });
  es.addEventListener('peer', e => {
    const x = JSON.parse(e.data);
    (state.peers[x.device] = state.peers[x.device] || {})[x.peer.id] = x.peer;
    render();
  });
  es.addEventListener('findme', e => { const x = JSON.parse(e.data); state.findme[x.device] = x; render(); });
  es.addEventListener('findsent', e => { const x = JSON.parse(e.data); state.findsent[x.device] = x.t; render(); });
  es.addEventListener('log', e => {
    state.logs.push(JSON.parse(e.data));
    if (state.logs.length > 600) state.logs.splice(0, 300);
    if (document.getElementById('debug').open) render();
  });
}

window.addEventListener('focus', checkRead);
window.addEventListener('blur', markActive);
document.addEventListener('visibilitychange', checkRead);
document.getElementById('debug').addEventListener('toggle', renderLog);
render();
connect();
setInterval(render, 1000);   // ages, the find-me banner and "Sent" run on the clock
</script>
</body>
</html>
